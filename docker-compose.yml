services:
  app:
    build: .
    ports:
      - "2026:2026"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017/eaterydb
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
